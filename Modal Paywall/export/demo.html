<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Suiteas Pay — drop-in demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f2f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .page { max-width: 480px; text-align: center; }
    h1 { font-size: 20px; }
    p { color: #5c5854; font-size: 14px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>PropertyUp checkout</h1>
    <p>This page has no React, no build step — just the script tag below and a div. Requires an EIP-1193 wallet (Core, MetaMask) on Avalanche Fuji to actually pay.</p>
    <div
      data-suiteas-pay
      data-merchant="PropertyUp"
      data-amount="0.12"
      data-pay-url="http://localhost:3000/api/pay"
    ></div>
  </div>

  <!-- Everything the widget needs — brand assets are inlined into this one file. -->
  <script src="./dist/suiteas-pay.js"></script>
</body>
</html>
