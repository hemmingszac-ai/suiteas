[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.24"
# OZ 5.1 uses mcopy (Cancun). Avalanche C-Chain supports Cancun (Durango upgrade).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Deploy writes deployments/<chainId>.json; Distribute reads the seeded usage
# file from script/. Nothing else on disk is reachable from a script.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./script" },
    { access = "read", path = "./test/fixtures" },
]

# Fuji deploy target. RPC + keys come from the environment, never hardcoded.
[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
