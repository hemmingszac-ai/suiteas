[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.24"
# OZ 5.1 uses mcopy (Cancun). Avalanche C-Chain supports Cancun (Durango upgrade).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Distribute READS deployments/<chainId>.json and the seeded usage file. Nothing
# else on disk is reachable from a script.
#
# `deployments` is read-only on purpose: Deploy.s.sol used to write that file from
# its own simulated addresses, which a `--resume` run silently corrupts (see the
# note at the bottom of script/Deploy.s.sol). `pnpm addresses` now builds it from
# broadcast receipts instead, so no script needs write access.
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "read", path = "./script" },
    { access = "read", path = "./test/fixtures" },
]

# Fuji deploy target. RPC + keys come from the environment, never hardcoded.
[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
